<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- background -->
  <rect width="512" height="512" rx="115" fill="#ffffff"/>

  <!-- "to" ghost — full text, very faded -->
  <text x="256" y="336"
    text-anchor="middle"
    font-family="'Syne', ui-sans-serif, system-ui, sans-serif"
    font-weight="800"
    font-size="290"
    fill="#111111"
    letter-spacing="-8"
    opacity="0.10">to</text>

  <!-- strikethrough bar -->
  <line x1="44" y1="258" x2="468" y2="258"
    stroke="#b93066" stroke-width="54" stroke-linecap="round"/>

  <!-- "to" top half — full opacity, clipped above the bar -->
  <clipPath id="above">
    <rect x="0" y="0" width="512" height="231"/>
  </clipPath>
  <text x="256" y="336"
    text-anchor="middle"
    font-family="'Syne', ui-sans-serif, system-ui, sans-serif"
    font-weight="800"
    font-size="290"
    fill="#111111"
    letter-spacing="-8"
    clip-path="url(#above)">to</text>
</svg>
