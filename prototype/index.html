  const tomD   = new Date(now); tomD.setDate(now.getDate() + 1);
  const tomStr = dStr(tomD);
  let evs = [], taskList = [];
  if (dateStr === todStr) {
    evs = events; taskList = tasks.filter(t => t.date === 'today');
  } else if (dateStr === tomStr) {
    taskList = tasks.filter(t => t.date === 'tomorrow');
  } else {
    evs = calExtra[dateStr] || [];
  }
  return { evs, taskList };
}

/* ─── RENDER MĚSÍC ─── */
function renderMesic() {
  const base = S.mesicDate;
  const y = base.getFullYear(), m = base.getMonth();
  const czMon = ['Leden','Únor','Březen','Duben','Květen','Červen',
                 'Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  $('js-cal-title').textContent = `${czMon[m]} ${y}`;

  const now    = new Date();
  const todStr = dStr(now);

  /* ── helpers ── */
  function getDayMeta(ds) {
    const [dy, dm, dd] = ds.split('-').map(Number);
    const key  = `${dm}-${dd}`;
    return {
      holiday: PUBLIC_HOLIDAYS[key] || null,
      nameday: NAMEDAYS[key]        || null,
      bday:    birthdays.find(b => b.month === dm && b.day === dd) || null,
    };
  }

  /* ── doodle SVG border — very gentle hand-drawn feel, ~1px wobble ── */
  function doodleFrame(role) {
    const s = role === 'today' ? 0.5 : 0.75;
    const c = role === 'today' ? '#b93066' : '#bbb';
    const o = role === 'today' ? '.55' : '.28';
    return `<svg class="doodle-frame" viewBox="0 0 100 100" fill="none" preserveAspectRatio="none" aria-hidden="true">
      <path d="M5 5 C30 4.2,60 5.6,95 5" stroke="${c}" stroke-width="${s}" stroke-linecap="round" opacity="${o}"/>
      <path d="M95 5 C95.8 30,96.4 60,95 95" stroke="${c}" stroke-width="${s}" stroke-linecap="round" opacity="${o}"/>
      <path d="M95 95 C70 95.8,40 94.4,5 95" stroke="${c}" stroke-width="${s}" stroke-linecap="round" opacity="${o}"/>
      <path d="M5 95 C4.2 70,3.6 40,5 5" stroke="${c}" stroke-width="${s}" stroke-linecap="round" opacity="${o}"/>
    </svg>`;
  }

  /* ── task dot rows per category ── */
  function taskDotsHTML(taskList, role) {
    if (!taskList.length) return '';

    if (role === 'today') {
      // Show each task as dot + title — there aren't many day-specific tasks
      const lines = taskList.slice(0, 6).map(t => {
        const col = CAT[t.tag]?.color || '#999';
        const dotStyle = t.done
          ? `border:1.5px solid ${col};background:transparent`
          : `background:${col}`;
        return `<div class="fc-task-line">
          <span class="tdot" style="${dotStyle}"></span>
          <span class="fc-task-lbl${t.done ? ' fc-task-done' : ''}">${t.title}</span>
        </div>`;
      }).join('');
      return `<div class="fc-tasks">${lines}</div>`;
    }

    // Side cards: compact category-grouped dots
    const cats = ['prace','rodina','domacnost','ostatni'];
    const rows = cats.map(cat => {
      const catTasks = taskList.filter(t => t.tag === cat);
      if (!catTasks.length) return '';
      const dots = catTasks.slice(0, 5).map(t =>
        `<span class="tdot${t.done ? ' tdot-ring' : ''}" style="${t.done ? `border-color:${CAT[cat].color}` : `background:${CAT[cat].color}`}"></span>`
      ).join('');
      return `<div class="fc-cat-row"><div class="fc-cat-dots">${dots}</div></div>`;
    }).filter(Boolean).join('');
    return rows ? `<div class="fc-tasks">${rows}</div>` : '';
  }

  /* ── build one focus card ── */
  function focusCardHTML(d, role) {
    const ds   = dStr(d);
    const day  = d.getDate();
    const dow  = ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'][d.getDay()];
    const meta = getDayMeta(ds);
    const { evs, taskList } = getDayItems(ds);

    const badge = role === 'today'
      ? `<span class="fc-badge">dnes</span>`
      : role === 'tomorrow'
      ? `<span class="fc-badge badge-side">zítra</span>`
      : `<span class="fc-badge badge-side">pozítří</span>`;

    let metaHTML = '';
    if (meta.holiday) metaHTML += `<span class="fc-holiday">🎉 ${meta.holiday}</span>`;
    if (meta.bday)    metaHTML += `<span class="fc-bday">🎂 ${meta.bday.name}</span>`;
    else if (meta.nameday) metaHTML += `<span class="fc-svatek">✦ ${meta.nameday}</span>`;

    const evHTML = evs.slice(0, role === 'today' ? 5 : 3).map(e =>
      `<div class="fc-ev-row" style="border-left-color:${CAT[e.tag]?.color||'#999'}">
        ${e.time ? `<span class="fc-ev-time">${e.time}</span>` : ''}
        <span class="fc-ev-title">${e.title}</span>
      </div>`
    ).join('');

    const cardClass = `focus-card fc-${role === 'today' ? 'today' : 'side'}`;

    return `<div class="${cardClass}" data-date="${ds}">
      ${doodleFrame(role)}
      <div class="fc-top">
        <div class="fc-dow-wrap">
          <span class="fc-dow">${dow}</span>
          ${badge}
        </div>
        ${metaHTML ? `<div class="fc-meta">${metaHTML}</div>` : ''}
      </div>
      <div class="fc-num">${day}</div>
      ${evHTML ? `<div class="fc-events">${evHTML}</div>` : ''}
      ${taskDotsHTML(taskList, role)}
    </div>`;
  }

  /* ── 3-day focus strip: today + next 2 days ── */
  const tom   = new Date(now); tom.setDate(now.getDate() + 1);
  const tom2  = new Date(now); tom2.setDate(now.getDate() + 2);

  const focusHTML = `<div class="cal-focus-grid">
    ${focusCardHTML(now,  'today')}
    ${focusCardHTML(tom,  'tomorrow')}
    ${focusCardHTML(tom2, 'dayafter')}
  </div>`;
  $('js-cal-focus').innerHTML = focusHTML;

  $('js-cal-focus').querySelectorAll('.focus-card').forEach(card => {
    card.addEventListener('click', () => openDaySheet(card.dataset.date));
  });

  /* ── mini month grid ── */
  const first  = new Date(y, m, 1);
  const last   = new Date(y, m + 1, 0).getDate();
  const rawDow = first.getDay();
  const offset = rawDow === 0 ? 6 : rawDow - 1;

  const now7   = now.getDay() === 0 ? 6 : now.getDay() - 1; // Mon-indexed weekday of today
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now7);
  const weekEnd   = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);

  let miniHtml = `<div class="cal-mini-label">${czMon[m]} ${y}</div>
  <div class="cal-mini-dow">
    <span>Po</span><span>Út</span><span>St</span><span>Čt</span><span>Pá</span>
    <span class="wknd">So</span><span class="wknd">Ne</span>
  </div>
  <div class="cal-mini-grid">`;

  for (let i = 0; i < offset; i++) miniHtml += `<div class="d-mini-cell off"></div>`;

  for (let dd = 1; dd <= last; dd++) {
    const cd   = new Date(y, m, dd);
    const cds  = dStr(cd);
    const col  = (offset + dd - 1) % 7;
    const isWknd  = col >= 5;
    const isToday = cds === todStr;
    const isThisW = cd >= weekStart && cd <= weekEnd && !isToday;

    const { evs, taskList } = getDayItems(cds);
    const active = taskList.filter(t => !t.done);
    const done   = taskList.filter(t =>  t.done);
    const total  = evs.length + taskList.length;

    const cls = ['d-mini-cell',
      isToday   ? 'd-today'    : '',
      isThisW   ? 'd-this-week': '',
      isWknd    ? 'wknd'       : '',
    ].filter(Boolean).join(' ');

    let cellContent = '';
    if (total > 0 && total <= 3) {
      // Text preview mode: show event titles + task names
      const evItems = evs.slice(0, 2).map(e =>
        `<div class="d-mini-ev-item" style="border-left-color:${CAT[e.tag]?.color||'#999'}">${e.title}</div>`
      ).join('');
      const taskItems = taskList.slice(0, 2).map(t => {
        const col = CAT[t.tag]?.color || '#999';
        const dotStyle = t.done ? `border:1px solid ${col};background:transparent` : `background:${col}`;
        return `<div class="d-mini-task-item">
          <span class="d-mini-task-dot" style="${dotStyle}"></span>
          <span>${t.title}</span>
        </div>`;
      }).join('');
      cellContent = evItems + taskItems;
    } else if (total > 3) {
      // Compact bars + dots mode for busy days
      const bars = evs.slice(0, 3).map(e =>
        `<div class="d-mini-bar" style="background:${CAT[e.tag]?.color||'#999'}"></div>`).join('');
      const tdots = [...active.map(t =>
        `<span class="d-mini-dot" style="background:${CAT[t.tag]?.color||'#999'}"></span>`),
        ...done.map(t =>
        `<span class="d-mini-dot ring" style="border-color:${CAT[t.tag]?.color||'#999'}"></span>`)
      ].slice(0, 5).join('');
      cellContent = (bars ? `<div class="d-mini-bars">${bars}</div>` : '')
                  + (tdots ? `<div class="d-mini-dots">${tdots}</div>` : '');
    }

    miniHtml += `<div class="${cls}" data-date="${cds}">
      <div class="d-mini-num">${dd}</div>
      ${cellContent}
    </div>`;
  }

  miniHtml += '</div>';
  $('js-cal-mini').innerHTML = miniHtml;

  $('js-cal-mini').querySelectorAll('.d-mini-cell:not(.off)').forEach(cell => {
    cell.addEventListener('click', () => openDaySheet(cell.dataset.date));
  });
}

/* ─── DAY SHEET ─── */
function czDayName(d)   { return ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'][d.getDay()]; }
function czMonthGen(m)  {
  return ['ledna','února','března','dubna','května','června',
          'července','srpna','září','října','listopadu','prosince'][m];
}

function openDaySheet(dateStr) {
  const [y, mo, d] = dateStr.split('-').map(Number);
  const date   = new Date(y, mo-1, d);
  const now    = new Date();
  const todStr = dStr(now);
  const tomD   = new Date(now); tomD.setDate(now.getDate()+1);
  const tomStr = dStr(tomD);

  const dayLabel = dateStr === todStr ? 'Dnes' : dateStr === tomStr ? 'Zítra' : czDayName(date);
  $('js-day-sub').textContent  = dayLabel;
  $('js-day-main').textContent = `${d}. ${czMonthGen(mo-1)} ${y}`;

  const { evs, taskList } = getDayItems(dateStr);
  let bodyHtml = '';

  if (evs.length > 0) {
    bodyHtml += `<span class="day-section-lbl">Kde musím být</span>`;
    bodyHtml += evs.map(e => `
      <div class="day-ev-row">
        <span class="day-ev-time">${e.time||'—'}</span>
        <span class="day-ev-title">${e.title}</span>
        <span class="day-ev-dot" style="background:${CAT[e.tag]?.color||'#999'}"></span>
      </div>`).join('');
  }

  if (taskList.length > 0) {
    bodyHtml += `<span class="day-section-lbl">Úkoly</span>`;
    bodyHtml += taskList.map(t => `
      <div class="day-task-row">
        <div class="day-task-cb" ${t.done ? 'style="background:var(--primary);border-color:var(--primary)"' : ''}></div>
        <span class="day-task-title" ${t.done ? 'style="opacity:.45;text-decoration:line-through"' : ''}>${t.title}</span>
        <span class="day-task-badge" data-tag="${t.tag}">${CAT[t.tag].label}</span>
      </div>`).join('');
  }

  if (!evs.length && !taskList.length) {
    bodyHtml = `<p class="day-empty">Nic naplánováno.<br>Volný den!</p>`;
  }

  const dateArg = dateStr === todStr ? 'today' : dateStr === tomStr ? 'tomorrow' : 'none';
  bodyHtml += `<button class="day-add-btn" data-date-arg="${dateArg}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Přidat úkol na tento den
  </button>`;

  $('js-day-body').innerHTML = bodyHtml;

  const addBtn = $('js-day-body').querySelector('.day-add-btn');
  if (addBtn) addBtn.addEventListener('click', () => { closeDaySheet(); openModal(addBtn.dataset.dateArg); });

  $('js-day-overlay').classList.add('open');
}

function closeDaySheet() { $('js-day-overlay').classList.remove('open'); }

/* ─── RENDER ÚKOLY — MOBILE (time groups) ─── */
function renderUkolyMobile(animate) {
  const body   = $('js-ukoly-mobile');
  const pool   = S.filter === 'vse' ? tasks : tasks.filter(t => t.tag === S.filter);
  const active = pool.filter(t => !t.done);
  const done   = pool.filter(t =>  t.done);

  if (!active.length && !done.length) {
    const catLabel = S.filter !== 'vse' ? CAT[S.filter]?.label : null;
    body.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🌿</div>
        <div class="empty-txt">${catLabel ? `V kategorii ${catLabel} nic není.` : 'Žádné úkoly.'}</div>
        <div class="empty-sub">${catLabel ? 'Přidej první úkol.' : 'Začni přidáním prvního úkolu.'}</div>
        <button class="empty-cta js-open-modal">+ Přidat úkol</button>
      </div>`;
    return;
  }

  const today    = active.filter(t => t.date === 'today');
  const tomorrow = active.filter(t => t.date === 'tomorrow');
  const nodate   = active.filter(t => !t.date || (t.date !== 'today' && t.date !== 'tomorrow'));
  const grp = (lbl, list) => list.length
    ? `<div class="grp-lbl">${lbl}</div><div class="task-stack">${list.map(taskHTML).join('')}</div>`
    : '';

  let html = grp('Dnes', today) + grp('Zítra', tomorrow) + grp('Bez data', nodate);

  if (done.length) {
    html += `
      <div class="done-toggle${S.showDone?'':' closed'}" id="js-utog">
        <span class="done-lbl">Archiv — splněno (${done.length})</span>
        <span class="done-arrow">▼</span>
      </div>
      <div class="done-list${S.showDone?'':' hidden'}" id="js-ulist" style="padding:0">
        ${done.map(taskHTML).join('')}
      </div>`;
  }

  body.innerHTML = html;
  reattachScratch(body, done);
  if (animate) body.querySelectorAll('.task-stack').forEach(stack => staggerIn(stack));

  const utog = $('js-utog');
  if (utog) utog.addEventListener('click', () => { S.showDone = !S.showDone; renderUkoly(); });
}

/* ─── RENDER ÚKOLY — DESKTOP (asymmetric layout) ─── */
function renderUkolyDesktop(animate) {
  const container = $('js-ukoly-desktop');
  const active = tasks.filter(t => !t.done);
  const done   = tasks.filter(t =>  t.done);

  const WAVE = {
    dnes:      'M0 3 C12 1,28 5,44 2.5 S68 1,85 3.5 L90 3',
    zitra:     'M0 2.5 C14 5,32 1,48 4 S70 1,90 3',
    bezdata:   'M0 4 C10 1,24 5,40 2 S60 5,80 2.5 L90 3',
    prace:     'M0 3 C8 1,18 4,28 2.5 S42 1,52 3 L55 3',
    rodina:    'M0 2.5 C10 5,22 1,34 4 S46 1,55 3',
    domacnost: 'M0 4 C7 1,16 5,27 2 S40 5,52 2.5 L55 3',
    ostatni:   'M0 3 C12 1,24 5,36 2.5 S48 4,55 3',
  };

  /* left column — Dnes / Zítra / Bez data sections */
  const todayTasks    = active.filter(t => t.date === 'today');
  const tomorrowTasks = active.filter(t => t.date === 'tomorrow');
  const nodateTasks   = active.filter(t => !t.date || (t.date !== 'today' && t.date !== 'tomorrow'));

  function leftSection(key, label, color, taskList) {
    if (!taskList.length) return '';
    return `<div class="ukoly-asym-section">
      <div class="ukoly-asym-label" style="color:${color}">${label}</div>
      <svg class="ukoly-asym-wave" viewBox="0 0 90 5" fill="none" aria-hidden="true" preserveAspectRatio="none">
        <path d="${WAVE[key]}" stroke="${color}" stroke-width="1.4" stroke-linecap="round" opacity=".4"/>
      </svg>
      <div class="task-stack">${taskList.map(t => taskHTML(t)).join('')}</div>
    </div>`;
  }

  let leftContent = leftSection('dnes',    'Dnes',    'var(--primary)',  todayTasks)
                  + leftSection('zitra',   'Zítra',   'var(--ink-2)',    tomorrowTasks)
                  + leftSection('bezdata', 'Bez data','var(--ink-3)',    nodateTasks);

  if (!leftContent) {
    leftContent = `<div class="empty" style="padding:20px 0">
      <div class="empty-icon">🌿</div>
      <div class="empty-txt">Žádné aktivní úkoly.</div>
      <button class="empty-cta js-open-modal">+ Přidat úkol</button>
    </div>`;
  }

  /* right column — 4 category mini-panels */
  const cats = ['prace','rodina','domacnost','ostatni'];
  let rightContent = cats.map(cat => {
    const catActive = active.filter(t => t.tag === cat);
    const catDone   = done.filter(t => t.tag === cat);
    const total     = catActive.length + catDone.length;
    const items = catActive.slice(0, 6).map(t =>
      `<div class="ukoly-cat-item">
        <span class="ukoly-cat-cb"></span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.title}</span>
      </div>`
    ).join('');
    const doneItems = catDone.slice(0, 2).map(t =>
      `<div class="ukoly-cat-item cat-item-done">
        <span class="ukoly-cat-cb done"></span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.title}</span>
      </div>`
    ).join('');

    return `<div class="ukoly-cat-panel">
      <div class="ukoly-cat-head">
        <span class="ukoly-cat-lbl" style="color:${CAT[cat].color}">${CAT[cat].label}</span>
        <span class="ukoly-cat-cnt">${catActive.length}${total > 0 ? `/${total}` : ''}</span>
      </div>
      <svg class="ukoly-cat-wave" viewBox="0 0 55 3" fill="none" aria-hidden="true" preserveAspectRatio="none">
        <path d="${WAVE[cat]}" stroke="${CAT[cat].color}" stroke-width="1.2" stroke-linecap="round" opacity=".35"/>
      </svg>
      ${items || doneItems
        ? items + doneItems
        : `<div style="font-size:10.5px;color:var(--ink-3);padding:2px 0">Vše splněno ✓</div>`}
    </div>`;
  }).join('');

  /* done / archive section */
  let doneSection = '';
  if (done.length) {
    doneSection = `<div class="ukoly-asym-done">
      <div class="done-toggle${S.showDone?'':' closed'}" id="js-utog">
        <span class="done-lbl">Archiv — splněno (${done.length})</span>
        <span class="done-arrow">▼</span>
      </div>
      <div class="done-list${S.showDone?'':' hidden'}" id="js-ulist">
        ${done.map(taskHTML).join('')}
      </div>
    </div>`;
  }

  container.innerHTML = `<div class="ukoly-asym">
    <div class="ukoly-asym-left">${leftContent}</div>
    <div class="ukoly-asym-right">${rightContent}</div>
  </div>${doneSection}`;

  reattachScratch(container, done);
  if (animate) container.querySelectorAll('.task-stack').forEach(stack => staggerIn(stack));

  const utog = $('js-utog');
  if (utog) utog.addEventListener('click', () => { S.showDone = !S.showDone; renderUkoly(); });
}

/* ─── RENDER ÚKOLY (dispatcher) ─── */
function renderUkoly(animate = false) {
  if (window.innerWidth >= 720) {
    $('js-ukoly-mobile').innerHTML   = '';
    renderUkolyDesktop(animate);
  } else {
    $('js-ukoly-desktop').innerHTML  = '';
    renderUkolyMobile(animate);
  }
}

/* ─── TOGGLE DONE ─── */
function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  if (!t.done) {
    lastCompletedId = id;
    const el = document.querySelector(`.task-item[data-id="${id}"]`);
    if (el) {
      applyScratch(el, false);
      const cb = el.querySelector('.task-cb');
      cb.style.transition = 'transform .18s cubic-bezier(0.16,1,0.3,1), border-color .15s, background .15s';
      cb.style.transform  = 'scale(1.22)';
      setTimeout(() => { cb.style.transform = 'scale(1)'; }, 10);
    }
    setTimeout(() => {
      t.done = true;
      t.completedAt = new Date();
      saveTasks();
      rerender();
      showUndo();
    }, 420);
  } else {
    t.done = false;
    delete t.completedAt;
    saveTasks();
    rerender();
  }
}

function rerender() {
  if (S.view === 'dnes')  renderDnes();
  if (S.view === 'ukoly') renderUkoly();
}

/* ─── VIEW SWITCH ─── */
function setView(v) {
  S.view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById(`v-${v}`).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.sb-item').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('js-fab').style.display = (v === 'narozeniny' || v === 'poznamky') ? 'none' : '';
  if (v === 'mesic')      renderMesic();
  if (v === 'ukoly')      renderUkoly(true);
  if (v === 'dnes')       renderDnes(true);
  if (v === 'narozeniny') renderNarozeniny();
  if (v === 'poznamky')   renderPoznamky();
}

/* ─── FILTER (mobile only) ─── */
function setFilter(f) {
  S.filter = f;
  document.querySelectorAll('.fp').forEach(p => p.classList.toggle('on', p.dataset.f === f));
  renderUkoly();
}

/* ─── MODAL ─── */
function openModal(presetDate) {
  const date = presetDate || 'today';
  S.form = { title:'', tag:null, date:date, rec:'none' };
  $('js-overlay').classList.add('open');
  $('js-task-input').value = '';
  $('js-save').disabled = true;
  document.querySelectorAll('.s-tag').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.s-date').forEach(b => b.classList.toggle('on', b.dataset.d === date));
  document.querySelectorAll('.s-rec').forEach(b  => b.classList.toggle('on', b.dataset.r === 'none'));
  setTimeout(() => $('js-task-input').focus(), 320);
}

function closeModal() { $('js-overlay').classList.remove('open'); }

function saveTask() {
  if (!S.form.title.trim()) return;
  tasks.unshift({
    id:    Date.now(),
    title: S.form.title.trim(),
    tag:   S.form.tag || 'ostatni',
    done:  false,
    date:  S.form.date === 'none' ? null : S.form.date,
    rec:   S.form.rec,
  });
  saveTasks();
  closeModal();
  rerender();
}

/* ─── RENDER NAROZENINY ─── */
function renderNarozeniny() {
  const now   = new Date();
  const todM  = now.getMonth() + 1;
  const todD  = now.getDate();
  const todY  = now.getFullYear();

  function daysUntil(month, day) {
    const next = new Date(todY, month - 1, day);
    if (next < now) next.setFullYear(todY + 1);
    return Math.round((next - new Date(todY, now.getMonth(), todD)) / 86400000);
  }

  function czMonthShort(m) {
    return ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'][m-1];
  }

  function avatarColor(name) {
    const palette = [
      { bg:'#EDF1F6', fg:'#1C3557' }, { bg:'#F9EDE9', fg:'#C4614A' },
      { bg:'#EBF3EE', fg:'#4A7C59' }, { bg:'#F0EEF3', fg:'#7A6E8A' },
      { bg:'#FEF0F6', fg:'#b93066' }, { bg:'#FFF8E7', fg:'#9B7A2F' },
    ];
    let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
    return palette[h % palette.length];
  }

  const sorted = [...birthdays].sort((a, b) => daysUntil(a.month, a.day) - daysUntil(b.month, b.day));
  const todays  = sorted.filter(b => b.month === todM && b.day === todD);
  const upcoming= sorted.filter(b => {
    if (b.month === todM && b.day === todD) return false;
    const d = daysUntil(b.month, b.day);
    return d <= 30;
  });
  const rest    = sorted.filter(b => {
    if (b.month === todM && b.day === todD) return false;
    return daysUntil(b.month, b.day) > 30;
  });

  function secHeader(label, badge) {
    return `<div class="bday-section">
      <div class="bday-sec-lbl">${label}${badge ? `<span class="bday-sec-lbl-badge">${badge}</span>` : ''}</div>
      <svg class="bday-sec-wave" viewBox="0 0 110 6" fill="none" aria-hidden="true" preserveAspectRatio="none">
        <path d="M0 4 C14 1,32 5.5,52 3 S80 1,100 4 L110 3" stroke="#b93066" stroke-width="1.4" stroke-linecap="round" opacity=".35"/>
      </svg>
    </div>`;
  }

  function tileHTML(b, isToday) {
    const days    = isToday ? 0 : daysUntil(b.month, b.day);
    const initials= b.name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
    const col     = avatarColor(b.name);
    const age     = b.yearBorn ? (todY - b.yearBorn) : null;
    const nextAge = b.yearBorn ? (todY - b.yearBorn + (days > 0 ? 1 : 0)) : null;
    const dateTxt = `${b.day}. ${czMonthShort(b.month)}.`;
    const cls     = isToday ? 'soon' : days <= 3 ? 'soon' : days <= 14 ? 'near' : 'far';
    const badge   = isToday ? '🎂 dnes' : days === 1 ? 'zítra' : days <= 14 ? `za ${days} dní` : dateTxt;
    const firstName = b.name.split(' ')[0];
    const extraCls  = isToday ? ' today-tile' : '';
    const ageShow   = isToday ? age : nextAge;
    const todayDoodle = isToday ? `<svg class="bday-tile-doodle" viewBox="0 0 100 100" fill="none" preserveAspectRatio="none" aria-hidden="true">
      <path d="M5 5 C30 4.2,60 5.6,95 5" stroke="#b93066" stroke-width="0.6" stroke-linecap="round" opacity=".5"/>
      <path d="M95 5 C95.8 30,96.4 60,95 95" stroke="#b93066" stroke-width="0.6" stroke-linecap="round" opacity=".5"/>
      <path d="M95 95 C70 95.8,40 94.4,5 95" stroke="#b93066" stroke-width="0.6" stroke-linecap="round" opacity=".5"/>
      <path d="M5 95 C4.2 70,3.6 40,5 5" stroke="#b93066" stroke-width="0.6" stroke-linecap="round" opacity=".5"/>
    </svg>` : '';
    return `<div class="bday-tile${extraCls}">
      ${todayDoodle}
      <div class="bday-tile-avatar" style="background:${col.bg};color:${col.fg}">${initials}</div>
      <div class="bday-tile-name">${firstName}</div>
      ${ageShow ? `<div class="bday-tile-age">${ageShow} let</div>` : ''}
      <span class="bday-tile-badge ${cls}">${badge}</span>
    </div>`;
  }

  function gridSection(label, badge, list, isToday) {
    if (!list.length) return '';
    return secHeader(label, badge) + `<div class="bday-grid">${list.map(b => tileHTML(b, isToday)).join('')}</div>`;
  }

  let html = '';
  if (todays.length)   html += gridSection('🎉 Dnes slaví', null, todays, true);
  if (upcoming.length) html += gridSection('Nadcházející', 'příštích 30 dní', upcoming, false);
  if (rest.length)     html += gridSection('Všechny narozeniny', null, rest, false);
  if (!birthdays.length) {
    html = `<div class="empty" style="margin-top:40px">
      <div class="empty-icon">🎂</div>
      <div class="empty-txt">Žádné narozeniny</div>
      <div class="empty-sub">Přidej první připomenutí.</div>
    </div>`;
  }
  $('js-narozeniny-body').innerHTML = html;
}

/* ─── RENDER POZNÁMKY ─── */
function noteDate(dateStr) {
  const now  = new Date();
  const tod  = dStr(now);
  const yest = dStr(new Date(now.getTime() - 86400000));
  if (dateStr === tod)  return 'dnes';
  if (dateStr === yest) return 'včera';
  const [, mo, dd] = dateStr.split('-').map(Number);
  return `${dd}. ${mo}.`;
}

function noteHTML(n) {
  const color = CAT[n.tag]?.color || '#999';
  const doodle = n.pinned ? `<svg class="note-doodle" viewBox="0 0 100 100" width="100%" height="100%" fill="none" preserveAspectRatio="none" aria-hidden="true">
    <path d="M8 5 C33 4.2,63 5.6,95 5" stroke="${color}" stroke-width="0.55" stroke-linecap="round" opacity=".4"/>
    <path d="M95 5 C95.8 30,96.4 60,95 95" stroke="${color}" stroke-width="0.55" stroke-linecap="round" opacity=".4"/>
    <path d="M95 95 C63 95.8,33 94.4,8 95" stroke="${color}" stroke-width="0.55" stroke-linecap="round" opacity=".4"/>
  </svg>` : '';
  return `<div class="note-card${n.pinned ? ' is-pinned' : ''}" data-nid="${n.id}" style="border-left-color:${color}">
    ${doodle}
    <div class="note-card-top">
      <div class="note-title">${n.title}</div>
      ${n.pinned ? '<span class="note-pin-icon">📌</span>' : ''}
    </div>
    ${n.body ? `<div class="note-body">${n.body}</div>` : ''}
    <div class="note-foot">
      <span class="note-badge" data-tag="${n.tag}">${CAT[n.tag].label}</span>
      <span class="note-date">${noteDate(n.createdAt)}</span>
    </div>
  </div>`;
}

function renderPoznamky() {
  const body = $('js-poz-body');
  const pool = S.noteFilter === 'vse' ? notes : notes.filter(n => n.tag === S.noteFilter);

  if (!pool.length) {
    body.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📓</div>
        <div class="empty-txt">Zatím žádné poznámky</div>
        <div class="empty-sub">Zapiš si cokoliv — recept, nápad, nákupní seznam…</div>
        <button class="empty-cta" id="js-note-empty-cta">+ Přidat první poznámku</button>
      </div>`;
    const cta = $('js-note-empty-cta');
    if (cta) cta.addEventListener('click', openNoteModal);
    return;
  }

  const pinned = pool.filter(n => n.pinned);
  const rest   = pool.filter(n => !n.pinned);
  let html = '';

  if (pinned.length) {
    html += `<div class="note-sec-lbl"><span>📌</span> Připnuté</div>
             <div class="poz-notes-stack">${pinned.map(noteHTML).join('')}</div>`;
  }
  if (rest.length) {
    if (pinned.length) html += `<div class="note-sec-lbl" style="margin-top:2px"><span>🗒️</span> Poznámky</div>`;
    html += `<div class="poz-notes-stack">${rest.map(noteHTML).join('')}</div>`;
  }

  body.innerHTML = html;

  body.querySelectorAll('.note-card').forEach(card => {
    card.addEventListener('click', () => openNoteAction(Number(card.dataset.nid)));
  });
}

/* ─── NOTE MODAL ─── */
function openNoteModal() {
  S.noteForm = { title:'', body:'', tag:null };
  $('js-note-title').value = '';
  $('js-note-body').value  = '';
  $('js-note-save').disabled = true;
  document.querySelectorAll('.s-ntag').forEach(b => b.classList.remove('on'));
  $('js-note-overlay').classList.add('open');
  setTimeout(() => $('js-note-title').focus(), 320);
}

function closeNoteModal() { $('js-note-overlay').classList.remove('open'); }

function saveNote() {
  if (!S.noteForm.title.trim()) return;
  notes.unshift({
    id:        Date.now(),
    title:     S.noteForm.title.trim(),
    body:      S.noteForm.body.trim(),
    tag:       S.noteForm.tag || 'ostatni',
    pinned:    false,
    createdAt: dStr(new Date()),
  });
  saveNotes();
  closeNoteModal();
  renderPoznamky();
}

function openNoteAction(id) {
  S.activeNoteId = id;
  const n = notes.find(x => x.id === id);
  if (!n) return;
  $('js-note-action-name').textContent = n.title;
  $('js-note-pin-icon').textContent = n.pinned ? '📌' : '📌';
  $('js-note-pin-lbl').textContent  = n.pinned ? 'Odepnout' : 'Připnout';
  $('js-note-action-overlay').classList.add('open');
}

function closeNoteAction() { $('js-note-action-overlay').classList.remove('open'); }

/* ─── BIRTHDAY MODAL ─── */
function openBdayModal() {
  $('js-bday-overlay').classList.add('open');
  $('js-bday-name').value  = '';
  $('js-bday-day').value   = '';
  $('js-bday-month').value = '';
  $('js-bday-year').value  = '';
  $('js-bday-save').disabled = true;
  setTimeout(() => $('js-bday-name').focus(), 320);
}

function closeBdayModal() { $('js-bday-overlay').classList.remove('open'); }

function saveBday() {
  const name  = $('js-bday-name').value.trim();
  const day   = parseInt($('js-bday-day').value);
  const month = parseInt($('js-bday-month').value);
  const year  = parseInt($('js-bday-year').value) || null;
  if (!name || !day || !month) return;
  birthdays.push({ id: Date.now(), name, month, day, yearBorn: year });
  saveBdays();
  closeBdayModal();
  renderNarozeniny();
}

/* ─── INIT ─── */
document.addEventListener('DOMContentLoaded', () => {
  loadTasks();
  loadBdays();
  loadNotes();
  initDate();
  renderDnes(true);

  document.querySelectorAll('.nav-btn:not(.ghost), .sb-item:not(.ghost)')
    .forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));

  $('js-filters').addEventListener('click', e => {
    const p = e.target.closest('.fp');
    if (p) setFilter(p.dataset.f);
  });

  document.addEventListener('click', e => {
    const cb = e.target.closest('.task-cb');
    if (cb) toggleDone(Number(cb.dataset.id));
    if (e.target.closest('.js-open-modal')) openModal();
  });

  $('js-fab').addEventListener('click', () => openModal());

  $('js-overlay').addEventListener('click', e => {
    if (e.target === $('js-overlay')) closeModal();
  });

  $('js-day-overlay').addEventListener('click', e => {
    if (e.target === $('js-day-overlay')) closeDaySheet();
  });

  $('js-undo-btn').addEventListener('click', () => {
    if (lastCompletedId !== null) {
      const t = tasks.find(x => x.id === lastCompletedId);
      if (t) { t.done = false; delete t.completedAt; saveTasks(); rerender(); }
    }
    hideUndo();
  });

  /* birthday FAB + modal */
  $('js-bday-add').addEventListener('click', openBdayModal);
  $('js-bday-overlay').addEventListener('click', e => {
    if (e.target === $('js-bday-overlay')) closeBdayModal();
  });

  const bdayValidate = () => {
    const ok = $('js-bday-name').value.trim() &&
               $('js-bday-day').value &&
               $('js-bday-month').value;
    $('js-bday-save').disabled = !ok;
  };
  ['js-bday-name','js-bday-day','js-bday-month','js-bday-year'].forEach(id => {
    $(id).addEventListener('input', bdayValidate);
  });
  $('js-bday-name').addEventListener('keydown', e => { if (e.key === 'Enter') saveBday(); if (e.key === 'Escape') closeBdayModal(); });
  $('js-bday-save').addEventListener('click', saveBday);

  const inp = $('js-task-input');
  inp.addEventListener('input', e => {
    S.form.title = e.target.value;
    $('js-save').disabled = !e.target.value.trim();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && S.form.title.trim()) saveTask();
    if (e.key === 'Escape') closeModal();
  });

  document.querySelectorAll('.s-tag').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.s-tag').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); S.form.tag = b.dataset.tag;
  }));
  document.querySelectorAll('.s-date').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.s-date').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); S.form.date = b.dataset.d;
  }));
  document.querySelectorAll('.s-rec').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.s-rec').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); S.form.rec = b.dataset.r;
  }));

  $('js-save').addEventListener('click', saveTask);

  /* ── notes ── */
  $('js-note-add').addEventListener('click', openNoteModal);

  $('js-poz-filters').addEventListener('click', e => {
    const p = e.target.closest('.fp');
    if (!p) return;
    S.noteFilter = p.dataset.pf;
    $('js-poz-filters').querySelectorAll('.fp').forEach(b => b.classList.toggle('on', b.dataset.pf === S.noteFilter));
    renderPoznamky();
  });

  $('js-note-overlay').addEventListener('click', e => {
    if (e.target === $('js-note-overlay')) closeNoteModal();
  });

  const noteTitleInp = $('js-note-title');
  const noteBodyInp  = $('js-note-body');
  const noteValidate = () => {
    S.noteForm.title = noteTitleInp.value;
    S.noteForm.body  = noteBodyInp.value;
    $('js-note-save').disabled = !noteTitleInp.value.trim();
  };
  noteTitleInp.addEventListener('input', noteValidate);
  noteBodyInp.addEventListener('input',  noteValidate);
  noteTitleInp.addEventListener('keydown', e => { if (e.key === 'Escape') closeNoteModal(); });

  document.querySelectorAll('.s-ntag').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.s-ntag').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); S.noteForm.tag = b.dataset.tag;
  }));

  $('js-note-save').addEventListener('click', saveNote);

  $('js-note-action-overlay').addEventListener('click', e => {
    if (e.target === $('js-note-action-overlay')) closeNoteAction();
  });

  $('js-note-pin-btn').addEventListener('click', () => {
    const n = notes.find(x => x.id === S.activeNoteId);
    if (!n) return;
    n.pinned = !n.pinned;
    saveNotes();
    closeNoteAction();
    renderPoznamky();
  });

  $('js-note-delete-btn').addEventListener('click', () => {
    notes = notes.filter(x => x.id !== S.activeNoteId);
    saveNotes();
    closeNoteAction();
    renderPoznamky();
  });

  $('js-cal-prev').addEventListener('click', () => {
    S.mesicDate = new Date(S.mesicDate.getFullYear(), S.mesicDate.getMonth()-1, 1);
    renderMesic();
  });
  $('js-cal-next').addEventListener('click', () => {
    S.mesicDate = new Date(S.mesicDate.getFullYear(), S.mesicDate.getMonth()+1, 1);
    renderMesic();
  });
});
</script>
</body>
</html>
